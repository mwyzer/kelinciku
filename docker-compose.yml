services:
  postgres:
    image: postgres:16-alpine
    container_name: duakelinci-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duakelinci_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-duakelinci_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diset di .env}
      TZ: Asia/Jakarta
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-duakelinci.sql:/docker-entrypoint-initdb.d/init-duakelinci.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - duakelinci-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: duakelinci-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - TZ=Asia/Jakarta
      - ENVIRONMENT=production
      - DB_TYPE=postgresql
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-duakelinci_dwh}
      - POSTGRES_USER=${POSTGRES_USER:-duakelinci_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diset di .env}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - duakelinci-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: duakelinci-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_STAFF_URL=http://localhost:3001
      - BACKEND_API_INTERNAL_URL=http://backend:8000/api/:path*
    depends_on:
      - backend
    networks:
      - duakelinci-network

  frontend-staff:
    build:
      context: ./frontend-staff
      dockerfile: Dockerfile
    container_name: duakelinci-frontend-staff
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - BACKEND_API_INTERNAL_URL=http://backend:8000/api/:path*
    depends_on:
      - backend
    networks:
      - duakelinci-network

volumes:
  postgres_data:
    driver: local

networks:
  duakelinci-network:
    driver: bridge
